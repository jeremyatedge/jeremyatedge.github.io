# Site
locale: "zh-CN"
title: "Jeremy Li"
title_separator: "-"
name: "Jingjin Li"
description: "Ph.D. student at UNNC"
url: "https://jeremyatedge.github.io"
baseurl: ""
repository: "jeremyatedge/jeremyatedge.github.io"
timezone: "Asia/Shanghai"

# Author profile
author:
  name: "Jingjin Li"
  avatar: "profile.png"
  bio: "Ph.D. student at University of Nottingham Ningbo China (UNNC) | Embedded AI | Power-aware Systems."
  location: "Ningbo, Zhejiang, China"
  email: "jingji.li@nottingham.edu.cn"
  linkedin: "jeremyli0621"
  googlescholar: "https://scholar.google.com/citations?user=--gMvG4AAAAJ&hl=en"
  orcid: "https://orcid.org/0000-0001-7248-5180"

# Content
include:
  - _pages

exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Dockerfile.dev
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - findings.md
  - progress.md
  - serve.sh
  - task_plan.md
  - vendor

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  sass_dir: _sass
  style: compressed

# GitHub Pages-compatible plugins used by the current site
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

whitelist:
  - jekyll-redirect-from
  - jekyll-sitemap

compress_html:
  clippings: all
  ignore:
    envs: development
